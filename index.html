<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiMeal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <!-- ONGLET 1 : JOURNAL -->
        <section id="tab-dashboard" class="tab-content active">
            <header class="header">
                <h1>Mon Journal</h1>
            </header>

            <!-- CARTE CENTRALE CALORIES ET NUTRITION -->
            <div class="card cal-summary-card">
                
                <!-- Compteur de Calories (Gros et Blanc) -->
                <div class="main-calorie-counter">
                    <h2>Calories du jour</h2>
                    <div class="cal-display">
                        <span id="calories-val">0</span> / <span id="calories-goal">2000</span> <small>kcal</small>
                    </div>
                </div>

                <!-- CARROUSEL / DEFILEMENT HORIZONTAL DES MACROS -->
                <div class="macros-scroll-container">
                    <div class="macros-flex">
                        <!-- Protéines -->
                        <div class="macro-card">
                            <div class="wheel-container">
                                <svg viewBox="0 0 36 36" class="circular-chart green">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path id="circle-protein" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="wheel-text">
                                    <span id="val-protein">0</span>g
                                </div>
                            </div>
                            <span class="macro-label">Protéines</span>
                            <span class="macro-goal"><span id="goal-protein">0</span>g</span>
                        </div>

                        <!-- Glucides -->
                        <div class="macro-card">
                            <div class="wheel-container">
                                <svg viewBox="0 0 36 36" class="circular-chart blue">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path id="circle-carb" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="wheel-text">
                                    <span id="val-carb">0</span>g
                                </div>
                            </div>
                            <span class="macro-label">Glucides</span>
                            <span class="macro-goal"><span id="goal-carb">0</span>g</span>
                        </div>

                        <!-- Sucres -->
                        <div class="macro-card">
                            <div class="wheel-container">
                                <svg viewBox="0 0 36 36" class="circular-chart yellow">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path id="circle-sugar" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="wheel-text">
                                    <span id="val-sugar">0</span>g
                                </div>
                            </div>
                            <span class="macro-label">Sucres</span>
                            <span class="macro-goal"><span id="goal-sugar">0</span>g</span>
                        </div>

                        <!-- Lipides -->
                        <div class="macro-card">
                            <div class="wheel-container">
                                <svg viewBox="0 0 36 36" class="circular-chart orange">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path id="circle-fat" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="wheel-text">
                                    <span id="val-fat">0</span>g
                                </div>
                            </div>
                            <span class="macro-label">Lipides</span>
                            <span class="macro-goal"><span id="goal-fat">0</span>g</span>
                        </div>

                        <!-- Fibres -->
                        <div class="macro-card">
                            <div class="wheel-container">
                                <svg viewBox="0 0 36 36" class="circular-chart purple">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path id="circle-fiber" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="wheel-text">
                                    <span id="val-fiber">0</span>g
                                </div>
                            </div>
                            <span class="macro-label">Fibres</span>
                            <span class="macro-goal"><span id="goal-fiber">0</span>g</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="day-log-container card">
                <button class="btn-primary spacing-bottom" onclick="openModal('modal-log')">+ Consommer un aliment</button>
                <h2 class="section-title">Consommations du jour</h2>
                <div id="log-list-container">
                    <!-- Injection dynamique des repas (SANS EMOJIS, géré par JS) -->
                </div>
            </div>
        </section>

        <!-- ONGLET 2 : BASE DE DONNÉES -->
        <section id="tab-bdd" class="tab-content">
            <header class="header">
                <h1>Base de Données</h1>
            </header>

            <div class="subnav spacing-bottom-large">
                <button class="subnav-btn active" onclick="switchSubTab('aliments')">Aliments</button>
                <button class="subnav-btn" onclick="switchSubTab('plats')">Plats / Recettes</button>
            </div>

            <div id="bdd-aliments" class="bdd-content active">
                <button class="btn-primary spacing-bottom" onclick="openModal('modal-food')">+ Créer un aliment</button>
                <ul id="food-list" class="item-list"></ul>
            </div>

            <div id="bdd-plats" class="bdd-content">
                <button class="btn-primary spacing-bottom" onclick="openModal('modal-recipe')">+ Créer un plat</button>
                <ul id="recipe-list" class="item-list"></ul>
            </div>
        </section>

        <!-- ONGLET 3 : PROFIL -->
        <section id="tab-profile" class="tab-content">
            <header class="header">
                <h1>Mon Profil</h1>
            </header>

            <div class="card">
                <form id="profile-form">
                    <div class="form-group">
                        <label for="prof-weight">Poids actuel (kg)</label>
                        <input type="number" id="prof-weight" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="prof-height">Taille (cm)</label>
                        <input type="number" id="prof-height" required>
                    </div>
                    <div class="form-group">
                        <label for="prof-age">Âge</label>
                        <input type="number" id="prof-age" required>
                    </div>
                    <div class="form-group">
                        <label for="prof-gender">Sexe</label>
                        <select id="prof-gender">
                            <option value="male">Homme</option>
                            <option value="female">Femme</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prof-activity">Niveau d'activité</label>
                        <select id="prof-activity">
                            <option value="1.15">Sédentaire</option>
                            <option value="1.2">Légèrement actif</option>
                            <option value="1.35">Modérément actif</option>
                            <option value="1.45">Très actif</option>
                            <option value="1.6">Extrêmement actif</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prof-goal">Objectif</label>
                        <select id="prof-goal" onchange="toggleGoalFields()">
                            <option value="maintain">Maintien de poids</option>
                            <option value="cut">Sèche / Perte de poids</option>
                            <option value="bulk">Prise de masse</option>
                        </select>
                    </div>

                    <div id="goal-custom-container" style="display: none;">
                        <div class="form-group">
                            <label for="prof-target-weight">Poids visé (kg)</label>
                            <input type="number" id="prof-target-weight" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="prof-target-days">Durée pour l'atteindre (jours)</label>
                            <input type="number" id="prof-target-days">
                        </div>
                    </div>

                    <div id="goal-indicator" style="display: none; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem;"></div>

                    <button type="submit" class="btn-primary">Mettre à jour mes objectifs</button>
                </form>
            </div>
        </section>

        <!-- NAVIGATION BAS DE PAGE (BOTTOM NAV) AVEC ICÔNES SVG -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('tab-dashboard', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>Journal</span>
            </button>
            <button class="nav-item" onclick="switchTab('tab-bdd', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
                <span>BDD</span>
            </button>
            <button class="nav-item" onclick="switchTab('tab-profile', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Profil</span>
            </button>
        </nav>

    </div>

    <!-- MODALE : Consommer un aliment -->
    <div id="modal-log" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-log')">&times;</span>
            <h3 class="section-title" style="margin-top:0;">Ajouter au Journal</h3>
            <form id="log-form">
                <div class="form-group">
                    <label for="log-meal-type">Moment de la journée</label>
                    <!-- Textes épurés, sans emojis -->
                    <select id="log-meal-type" required>
                        <option value="breakfast">Petit-déjeuner</option>
                        <option value="lunch">Déjeuner</option>
                        <option value="dinner">Repas du soir</option>
                        <option value="snack">Collation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Choisir l'aliment ou le plat</label>
                    <input type="text" id="log-search-input" placeholder="Rechercher un aliment..." oninput="filterLogFoodList()" style="margin-bottom: 8px;">
                    
                    <div id="log-food-picker" style="max-height: 160px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; padding: 4px;">
                    </div>
                    <input type="hidden" id="log-selected-item-id" required>
                </div>

                <div class="form-group">
                    <label for="log-amount">Quantité (g ou ml)</label>
                    <input type="number" id="log-amount" value="100" required>
                </div>

                <button type="submit" class="btn-primary">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- MODALE : Créer un Aliment -->
    <div id="modal-food" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-food')">&times;</span>
            <h3 class="section-title" style="margin-top:0;">Nouvel Aliment (pour 100g)</h3>
            <form id="food-form">
                <div class="form-group">
                    <label for="food-name">Nom de l'aliment</label>
                    <input type="text" id="food-name" required>
                </div>
                <div class="form-group">
                    <label for="food-cal">Calories (kcal)</label>
                    <input type="number" id="food-cal" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="food-prot">Protéines (g)</label>
                    <input type="number" id="food-prot" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="food-carb">Glucides (g)</label>
                    <input type="number" id="food-carb" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="food-sug">dont Sucres (g)</label>
                    <input type="number" id="food-sug" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="food-fat">Lipides (g)</label>
                    <input type="number" id="food-fat" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="food-fib">Fibres (g)</label>
                    <input type="number" id="food-fib" step="0.1" required>
                </div>
                <button type="submit" class="btn-primary">Enregistrer dans la BDD</button>
            </form>
        </div>
    </div>

    <!-- MODALE : Créer un Plat / Recette -->
    <div id="modal-recipe" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-recipe')">&times;</span>
            <h3 class="section-title" style="margin-top:0;">Créer un Plat / Recette</h3>
            <form id="recipe-form">
                <div class="form-group">
                    <label for="recipe-name">Nom du plat</label>
                    <input type="text" id="recipe-name" required>
                </div>

                <label style="display:block; margin-bottom:8px;">Ingrédients</label>
                <div id="recipe-ingredients-container"></div>

                <button type="button" class="btn-primary spacing-bottom" onclick="addIngredientRow()" style="background:#34495e;">+ Ajouter un ingrédient</button>

                <button type="submit" class="btn-primary">Calculer et Sauvegarder le Plat</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
