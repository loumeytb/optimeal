<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suivi Nutrition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- ONGLET 1 : JOURNAL (DASHBOARD)             -->
    <!-- ========================================== -->
    <div id="tab-journal" class="tab-content active">
        <!-- Bannière Calories -->
        <div class="calorie-banner">
            <span class="calorie-label">Calories Restantes</span>
            <div class="calorie-number">
                <span id="calories-val">0</span> <span class="calorie-unit">/ <span id="calories-goal">2000</span> kcal</span>
            </div>
        </div>

        <!-- Carrousel des 5 Macro-nutriments -->
        <div class="macro-carousel-container">
            <div class="macro-carousel">
                
                <!-- Protéines -->
                <div class="macro-card">
                    <svg class="circular-chart" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="circle-protein" class="circle protein" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <span class="macro-name">Protéines</span>
                    <span class="macro-val"><span id="val-protein">0</span> / <span id="goal-protein">150</span>g</span>
                </div>

                <!-- Glucides -->
                <div class="macro-card">
                    <svg class="circular-chart" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="circle-carb" class="circle carb" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <span class="macro-name">Glucides</span>
                    <span class="macro-val"><span id="val-carb">0</span> / <span id="goal-carb">250</span>g</span>
                </div>

                <!-- Sucres -->
                <div class="macro-card">
                    <svg class="circular-chart" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="circle-sugar" class="circle sugar" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <span class="macro-name">Sucres</span>
                    <span class="macro-val"><span id="val-sugar">0</span> / <span id="goal-sugar">50</span>g</span>
                </div>

                <!-- Lipides -->
                <div class="macro-card">
                    <svg class="circular-chart" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="circle-fat" class="circle fat" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <span class="macro-name">Lipides</span>
                    <span class="macro-val"><span id="val-fat">0</span> / <span id="goal-fat">70</span>g</span>
                </div>

                <!-- Fibres -->
                <div class="macro-card">
                    <svg class="circular-chart" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="circle-fiber" class="circle fiber" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <span class="macro-name">Fibres</span>
                    <span class="macro-val"><span id="val-fiber">0</span> / <span id="goal-fiber">30</span>g</span>
                </div>

            </div>
        </div>

        <!-- Journal de la journée -->
        <div class="day-log-container">
            <button class="btn-primary" onclick="openModal('modal-log')">+ Consommer un aliment</button>
            
            <h2 class="section-title">Consommations du jour</h2>
            <ul id="log-list" class="item-list">
                <!-- Rempli en JS -->
            </ul>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ONGLET 2 : BASE DE DONNÉES                 -->
    <!-- ========================================== -->
    <div id="tab-bdd" class="tab-content">
        <div class="bdd-subnav">
            <button class="subnav-btn active" onclick="switchSubTab('aliments')">Aliments</button>
            <button class="subnav-btn" onclick="switchSubTab('plats')">Plats / Recettes</button>
        </div>

        <!-- Sous-onglet Aliments -->
        <div id="bdd-aliments" class="bdd-content active">
            <div class="bdd-action-bar">
                <button class="btn-primary" onclick="openModal('modal-food')">+ Nouvel Aliment</button>
            </div>
            <ul id="food-list" class="item-list">
                <!-- Rempli en JS -->
            </ul>
        </div>

        <!-- Sous-onglet Plats -->
        <div id="bdd-plats" class="bdd-content">
            <div class="bdd-action-bar">
                <button class="btn-primary" onclick="openModal('modal-recipe')">+ Nouveau Plat</button>
            </div>
            <ul id="recipe-list" class="item-list">
                <!-- Rempli en JS -->
            </ul>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ONGLET 3 : PROFIL & OBJECTIFS             -->
    <!-- ========================================== -->
    <div id="tab-profile" class="tab-content">
        <div class="profile-container">
            <h2 class="section-title" style="margin-top:0;">Vos Informations</h2>
            
            <form id="profile-form">
                <div class="form-group">
                    <label for="prof-weight">Poids (kg)</label>
                    <input type="number" id="prof-weight" step="0.1" placeholder="ex: 70">
                </div>
                <div class="form-group">
                    <label for="prof-height">Taille (cm)</label>
                    <input type="number" id="prof-height" placeholder="ex: 175">
                </div>
                <div class="form-group">
                    <label for="prof-age">Âge</label>
                    <input type="number" id="prof-age" placeholder="ex: 20">
                </div>
                <div class="form-group">
                    <label for="prof-gender">Sexe</label>
                    <select id="prof-gender">
                        <option value="male">Homme</option>
                        <option value="female">Femme</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="prof-activity">Niveau d'activité</label>
                    <select id="prof-activity">
                        <option value="1.2">Sédentaire</option>
                        <option value="1.375">Légèrement actif (1-3 fois/semaine)</option>
                        <option value="1.55">Modérément actif (3-5 fois/semaine)</option>
                        <option value="1.725">Très actif (6-7 fois/semaine)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="prof-goal">Objectif</label>
                    <select id="prof-goal">
                        <option value="cut">Sèche / Perte de poids (-15%)</option>
                        <option value="maintain">Maintien</option>
                        <option value="bulk">Prise de masse (+15%)</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="margin-top:10px;">Calculer & Enregistrer les Objectifs</button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODALES / POP-UPS                          -->
    <!-- ========================================== -->

    <!-- Modale : Consommer un aliment -->
    <div id="modal-log" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-log')">&times;</span>
            <h3 class="section-title" style="margin-top:0;">Ajouter au Journal</h3>
            <form id="log-form">
                <div class="form-group">
                    <label for="log-select">Choisir l'aliment/plat</label>
                    <select id="log-select" required></select>
                </div>
                <div class="form-group">
                    <label for="log-amount">Quantité (g ou ml)</label>
                    <input type="number" id="log-amount" value="100" required>
                </div>
                <button type="submit" class="btn-primary">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- Modale : Ajouter un Aliment -->
    <div id="modal-food" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-food')">&times;</span>
            <h3 class="section-title" style="margin-top:0;">Nouvel Aliment (pour 100g)</h3>
            <form id="food-form">
                <div class="form-group">
                    <label for="food-name">Nom de l'aliment</label>
                    <input type="text" id="food-name" required placeholder="ex: Poulet, Riz...">
                </div>
                <div class="form-group">
                    <label for="food-cal">Calories (kcal)</label>
                    <input type="number" id="food-cal" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="food-prot">Protéines (g)</label>
                    <input type="number" id="food-prot" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label for="food-carb">Glucides (g)</label>
                    <input type="number" id="food-carb" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label for="food-sug">dont Sucres (g)</label>
                    <input type="number" id="food-sug" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label for="food-fat">Lipides (g)</label>
                    <input type="number" id="food-fat" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label for="food-fib">Fibres (g)</label>
                    <input type="number" id="food-fib" step="0.1" value="0">
                </div>
                <button type="submit" class="btn-primary">Enregistrer l'Aliment</button>
            </form>
        </div>
    </div>

    <!-- Modale : Créer un Plat -->
    <div id="modal-recipe" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-recipe')">&times;</span>
            <h3 class="section-title" style="margin-top:0;">Créer un Plat / Recette</h3>
            <form id="recipe-form">
                <div class="form-group">
                    <label for="recipe-name">Nom du plat</label>
                    <input type="text" id="recipe-name" required placeholder="ex: Bol Avoine & Banane">
                </div>
                
                <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:10px;">Ingrédients du plat :</p>
                <div id="recipe-ingredients-container"></div>
                
                <button type="button" class="btn-primary" style="background-color: var(--card-bg); border:1px solid var(--border-color); margin-bottom:15px;" onclick="addIngredientRow()">+ Ajouter un ingrédient</button>

                <button type="submit" class="btn-primary">Enregistrer le Plat</button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- BARRE DE NAVIGATION FIXE EN BAS            -->
    <!-- ========================================== -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('tab-journal', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>Journal</span>
        </button>
        <button class="nav-item" onclick="switchTab('tab-bdd', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M21 19c0 1.66-4 3-9 3s-9-1.34-9-3"></path></svg>
            <span>BDD</span>
        </button>
        <button class="nav-item" onclick="switchTab('tab-profile', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
